<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>battleship</title>
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<style>
:root{--bd:#1e3a8a;--bg:#020617;--tx:#c7d2fe;--gl:#3b82f6;--sea:#06142e;--sn:#7dd3fc;--fire:#ff7a3d;--red:#ef4444;--c:clamp(18px,min(calc((100vw - 64px)/21.8),calc((100vh - 170px)/10.8)),50px)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Minecraftia',monospace;font-size:11px;overflow:hidden}
button{font:inherit;text-transform:lowercase;padding:7px 11px;border:1px solid var(--bd);border-radius:4px;background:#0f172a;color:var(--tx);cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:var(--bd);box-shadow:0 0 10px rgba(59,130,246,.35)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--bd);border-color:var(--gl)}
button.big{padding:11px 18px;font-size:13px;background:var(--bd);border-color:var(--gl)}
:focus-visible{outline:2px solid var(--sn);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--bd);background:rgba(2,6,23,.85)}
header b{font-size:14px;font-weight:normal;text-shadow:0 0 8px var(--gl)}
#msg{flex:1;text-align:center;min-height:14px;line-height:1.4}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
/* menu */
#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:12px;overflow:auto}
#menu h1{font-size:26px;font-weight:normal;text-shadow:0 0 14px var(--gl)}
#menu p,#menu small{opacity:.7;line-height:1.5;max-width:340px}
.radar{width:118px;height:118px;border-radius:50%;border:2px solid var(--bd);position:relative;overflow:hidden;background:repeating-radial-gradient(circle,transparent 0 13px,rgba(125,211,252,.22) 14px 15px),#04101f;box-shadow:0 0 22px rgba(59,130,246,.4)}
.radar::after{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 70%,rgba(125,211,252,.7));animation:sw 3s linear infinite}
.radar i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--fire);box-shadow:0 0 8px var(--fire);animation:bl 3s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
@keyframes bl{0%,100%{opacity:0}15%{opacity:1}60%{opacity:0}}
.opt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.opt label{display:flex;gap:6px;align-items:center;cursor:pointer}
/* game layout */
#game{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:24px;padding:8px 14px;position:relative}
#game.setup{--c:clamp(18px,min(calc((100vw - 300px)/10.8),calc((100vh - 130px)/10.8)),50px)}
#game section{display:flex;flex-direction:column;align-items:center;gap:6px}
#game h4{font-size:11px;font-weight:normal;opacity:.75;transition:.2s}
.my #es h4{opacity:1;color:var(--sn);text-shadow:0 0 8px var(--sn)}
.setup #es,.battle #dock{display:none}
#dock{width:210px;display:flex;flex-direction:column;gap:6px}
.dkb{display:flex;align-items:center;gap:8px;text-align:left}
.dkb span:nth-child(2){flex:1}.dkb.done{opacity:.6}.dkb.on{opacity:1}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:11px}
.tl svg{display:block;width:calc(var(--L)*9px);height:9px}
.tl.sunk{opacity:.3;filter:grayscale(1)}
.f1{fill:#8fa6c9}.f2{fill:#53688f}.f3{fill:#dbe4f5}
/* board */
.board{display:grid;grid-template-columns:calc(var(--c)*.6) auto;grid-template-rows:calc(var(--c)*.6) auto;font-size:max(8px,calc(var(--c)*.3));opacity:.95}
.cl{grid-row:1;grid-column:2;display:grid;grid-template-columns:repeat(10,var(--c));text-align:center;align-items:center;opacity:.6}
.rl{grid-row:2;grid-column:1;display:grid;grid-template-rows:repeat(10,var(--c));align-items:center;text-align:center;opacity:.6}
.grid{grid-row:2;grid-column:2;position:relative;display:grid;grid-template:repeat(10,var(--c))/repeat(10,var(--c));border:2px solid var(--bd);background:var(--sea);overflow:hidden;box-shadow:0 0 18px rgba(30,58,138,.5)}
#eb .grid{background:repeating-radial-gradient(circle at 50% 50%,transparent 0 calc(var(--c)*1.6),rgba(125,211,252,.09) calc(var(--c)*1.6 + 1px) calc(var(--c)*1.6 + 2px)),var(--sea)}
#eb .grid::before{content:"";display:none;position:absolute;left:-50%;top:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent 82%,rgba(125,211,252,.3));animation:sw 3.4s linear infinite;pointer-events:none}
.my #eb .grid::before{display:block}
.grid.shake{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cell{position:relative;padding:0;font-size:0;border:1px solid rgba(59,130,246,.18);border-radius:0;background:transparent}
.grid .cell:hover:not(:disabled){background:transparent;box-shadow:none}
.my #eb .cell.u{cursor:crosshair}
.my #eb .cell.u:hover:not(:disabled){background:rgba(125,211,252,.22);box-shadow:inset 0 0 0 2px var(--sn)}
.ships{position:absolute;inset:0;pointer-events:none;z-index:1}
.ship{position:absolute}
.ship svg{display:block;width:calc(var(--c)*var(--L));height:var(--c);overflow:visible}
.ship.v svg{transform-origin:0 0;transform:translateX(var(--c)) rotate(90deg)}
.ship.sunk svg{filter:grayscale(1) brightness(.5)}
.ship.rev{opacity:.55}
.cell.m::after{content:"";position:absolute;inset:34%;border-radius:50%;border:2px solid #9fb4d9;opacity:.8;z-index:2}
.cell.h::after{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,#fff6c2 0 18%,var(--fire) 40%,#b91c1c 72%,transparent 74%);z-index:2;animation:fl .6s steps(2) infinite alternate}
.cell.new.h::after{animation:boom .5s ease-out,fl .6s steps(2) .5s infinite alternate}
.cell.new.m::before{content:"";position:absolute;inset:30%;border:2px solid var(--sn);border-radius:50%;z-index:2;animation:rip .7s ease-out forwards}
.cell.pv::before,.cell.bad::before{content:"";position:absolute;inset:0;z-index:2}
.cell.pv::before{background:rgba(125,211,252,.35)}.cell.bad::before{background:rgba(239,68,68,.45)}
@keyframes fl{to{transform:scale(.86) rotate(14deg);filter:brightness(1.25)}}
@keyframes boom{from{transform:scale(3.2);opacity:0}40%{opacity:1}to{transform:none}}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
/* motion + smoothness */
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
@keyframes fadein{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.7)}60%{transform:scale(1.04)}}
@keyframes flt{50%{transform:translateY(-6px)}}
@keyframes msg{from{opacity:0;transform:translateY(5px)}}
@keyframes shm{to{background-position:-250% 0}}
@keyframes fdo{from{opacity:1}to{opacity:0}}
@keyframes tp{50%{box-shadow:0 0 20px rgba(125,211,252,.85)}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(1.15)}}
#menu:not([hidden])>*{animation:fin .5s cubic-bezier(.2,.9,.3,1) both}
#menu>:nth-child(2){animation-delay:0.12s}#menu>:nth-child(3){animation-delay:0.18s}#menu>:nth-child(4){animation-delay:0.24s}#menu>:nth-child(5){animation-delay:0.30s}#menu>:nth-child(6){animation-delay:0.36s}#menu>:nth-child(7){animation-delay:0.42s}#menu>:nth-child(8){animation-delay:0.48s}
#online:not([hidden]),#game:not([hidden]){animation:fadein .35s ease-out}
#es,#ps,#dock{animation:fin .45s cubic-bezier(.2,.9,.3,1) backwards}
#ps{animation-delay:.08s}
#end:not([hidden]){animation:fadein .3s ease-out}
.card{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
.radar{animation:flt 4.5s ease-in-out infinite}
#msg.sw{animation:msg .3s ease-out}
button:active:not(:disabled){transform:scale(.95)}
button:hover:not(:disabled){transform:translateY(-1px)}
.grid .cell:hover:not(:disabled),.grid .cell:active:not(:disabled){transform:none}
.cell{transition:background .12s,box-shadow .12s}
.ship.pop svg{animation:drop .4s cubic-bezier(.2,1.2,.4,1)}
.ship.sunk.pop svg{animation:drop .6s cubic-bezier(.2,1.2,.4,1)}
.ship svg{transition:filter .4s}
.cell.new.h::before{content:"";position:absolute;inset:10%;border:2px solid var(--fire);border-radius:50%;z-index:2;animation:rip .6s ease-out forwards}
#pb .grid::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(125,211,252,.08) 50%,transparent 60%);background-size:250% 100%;animation:shm 7s linear infinite}
.grid.sunkfx::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle,rgba(255,122,61,.6),transparent 70%);animation:fdo .7s ease-out forwards}
#eb{transition:opacity .35s}
.battle:not(.my) #eb{opacity:.6}
.pt.turn{animation:tp 1.5s ease-in-out infinite}
.pimg{animation:fadein .4s}
/* online */
#online{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:12px;overflow:auto}
#online h1{font-size:22px;font-weight:normal;text-shadow:0 0 14px var(--gl)}
#online p,#online small{opacity:.7;line-height:1.5;max-width:340px}
.plate:empty{display:none}
.pt{display:flex;align-items:center;gap:9px;max-width:100%;padding:3px 12px 3px 5px;border:1px solid var(--bd);border-radius:999px;background:rgba(15,23,42,.8);transition:.2s}
.pt.turn{border-color:var(--sn);box-shadow:0 0 12px rgba(125,211,252,.5)}
.pav{position:relative;flex:none;width:32px;height:32px}
.pimg{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0b1f4b}
.pdec{position:absolute;left:-10%;top:-10%;width:120%;height:120%;max-width:none;object-fit:contain;pointer-events:none}
.pnm{display:flex;flex-direction:column;min-width:0;text-align:left;line-height:1.3}
.pnm b{font-weight:normal;font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnm small{font-size:9px;opacity:.6}
#game.mp{--c:clamp(18px,min(calc((100vw - 64px)/21.8),calc((100vh - 235px)/10.8)),50px)}
#game.setup.mp{--c:clamp(18px,min(calc((100vw - 300px)/10.8),calc((100vh - 190px)/10.8)),50px)}
#dock .pt{align-self:flex-start}
/* end screen */
#end{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.8)}
.card{padding:22px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;border:2px solid var(--bd);background:var(--bg);box-shadow:0 0 30px rgba(59,130,246,.4)}
.card h2{font-size:24px;font-weight:normal}
.card.win h2{color:var(--sn);text-shadow:0 0 12px var(--sn)}.card.lose h2{color:var(--red);text-shadow:0 0 12px var(--red)}
.st{display:flex;gap:18px;justify-content:center}.st span{display:flex;flex-direction:column;gap:4px;opacity:.8}.st b{font-size:16px;font-weight:normal;color:#fff}
@media(max-width:620px){:root,#game.setup,#game.mp,#game.setup.mp{--c:min(calc((100vw - 40px)/10.8),34px)}#game{flex-direction:column;overflow:auto;justify-content:flex-start;padding:8px;gap:12px}#dock{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">
  <header><b>battleship</b><span id="msg"></span><button id="mu" title="sound (m)">🔊</button><button id="qt" hidden>menu</button></header>
  <main id="menu">
    <div class="radar"><i style="left:70%;top:30%"></i><i style="left:30%;top:64%;animation-delay:-1.2s"></i><i style="left:62%;top:72%;animation-delay:-2.1s"></i></div>
    <h1>battleship</h1>
    <p>hide your five ships, then hunt down the enemy fleet. hit a ship and you fire again. first to sink them all wins.</p>
    <div class="opt"><span>enemy</span><div class="row" id="dif"><button data-d="0">easy</button><button data-d="1">normal</button><button data-d="2">hard</button></div></div>
        <button class="big" id="go">play vs computer</button><button class="big" id="onl">play online (2 players)</button>
    <small id="rec"></small>
  </main>
  <main id="online" hidden></main>
  <div id="game" hidden>
    <section id="es"><div class="plate" id="ep"></div><h4 id="eh">enemy waters</h4><div id="eb"></div><div class="fl" id="ef"></div></section>
    <section id="ps"><div class="plate" id="pp"></div><h4>your fleet</h4><div id="pb"></div><div class="fl" id="pf"></div></section>
    <aside id="dock"></aside>
    <div id="end" hidden></div>
  </div>
</div>
<script>
const N=10,SH=[["carrier",5],["battleship",4],["cruiser",3],["submarine",3],["destroyer",2]],DF=["easy","normal","hard"];
const $=s=>document.querySelector(s),rnd=n=>Math.random()*n|0,gm=$("#game");
const mk=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch{}};
const say=t=>{const m=$("#msg");m.textContent=t;m.classList.remove("sw");void m.offsetWidth;m.classList.add("sw")},cell=i=>String.fromCharCode(65+i%N)+(Math.floor(i/N)+1);
const act=d=>{try{parent.postMessage({wcActivity:{name:"battleship",detail:d}},"*")}catch{}};
let G=null,P=null,pg,eg,phase="menu",MUTE=ls("bs_mute")===1,CFG=Object.assign({diff:1,streak:0},ls("bs_cfg"));

/* ---- sound (synthesized, no files) ---- */
let AC;const A=()=>{try{return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}catch{}};
const tone=(f,d,ty="sine",v=.12,f2)=>{const a=A();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start();o.stop(t+d)};
const hiss=(d,fc,v=.2)=>{const a=A();if(!a||MUTE)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=b;f.type="lowpass";f.frequency.value=fc;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start()};
const snd=r=>{if(r==="win")[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.14),i*150));else if(r==="lose")[392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.4,"sawtooth",.08),i*220));else if(r==="ping")tone(1200,.6,"sine",.07,900);else if(r.sunk){hiss(.9,500,.3);tone(140,.9,"sawtooth",.15,35)}else if(r.hit){hiss(.4,700,.25);tone(110,.3,"square",.1,50)}else hiss(.3,1400,.1)};
$("#mu").textContent=MUTE?"🔇":"🔊";
const toggleMute=()=>{MUTE=!MUTE;ls("bs_mute",MUTE?1:0);$("#mu").textContent=MUTE?"🔇":"🔊"};
$("#mu").onclick=toggleMute;

/* ---- fleet model ---- */
const cellsOf=s=>Array.from({length:s.len},(_,j)=>(s.r+(s.v?j:0))*N+s.c+(s.v?0:j));
const free=(ships,len,r,c,v)=>{if(r<0||c<0||(v?c>=N||r+len>N:r>=N||c+len>N))return false;const used=new Set();ships.forEach(s=>s&&cellsOf(s).forEach(i=>used.add(i)));return cellsOf({len,r,c,v}).every(i=>!used.has(i))};
const randFleet=()=>{const ships=[];SH.forEach(([n,len],k)=>{let s;do{s={k,n,len,r:rnd(N),c:rnd(N),v:Math.random()<.5,hits:0}}while(!free(ships,len,s.r,s.c,s.v));ships.push(s)});return ships};
const newB=ships=>{const occ=Array(100).fill(-1);ships.forEach((s,i)=>cellsOf(s).forEach(x=>occ[x]=i));return{ships,occ,shots:Array(100).fill(0),sk:new Set()}};
const shoot=(B,i)=>{if(B.shots[i])return null;const k=B.occ[i];if(k<0){B.shots[i]=1;return{hit:0}}B.shots[i]=2;const s=B.ships[k];s.hits++;const sunk=s.hits===s.len;if(sunk)cellsOf(s).forEach(x=>B.sk.add(x));return{hit:1,sunk,s}};
const lost=B=>B.ships.every(s=>s.hits===s.len);

/* ---- ship art ---- */
const svgShip=(k,L)=>{const W=L*10,S=`stroke="#0a1226" stroke-width=".5"`;let b=`<path class="f1" ${S} d="M1.5 5 3.5 2H${W-5}L${W-1} 5 ${W-5} 8H3.5Z"/>`;
  const t=x=>`<circle class="f2" ${S} cx="${x}" cy="5" r="1.7"/><path d="M${x} 5h3" stroke="#0a1226" stroke-width=".7"/>`,br=(x,w)=>`<rect class="f3" x="${x}" y="3.5" width="${w}" height="3"/>`;
  if(k===0)b+=`<rect class="f2" x="6" y="3" width="${W-17}" height="4"/><path d="M8 5H${W-13}" stroke="#dbe4f5" stroke-width=".5" stroke-dasharray="2 1.6"/><rect class="f3" x="${W*.6}" y="1" width="7" height="2.2"/>`;
  else if(k===1)b+=t(W*.2)+t(W*.36)+br(W*.5,W*.14)+t(W*.8);
  else if(k===2)b+=t(W*.24)+br(W*.42,W*.16)+t(W*.78);
  else if(k===3)b=`<ellipse class="f2" ${S} cx="${W/2}" cy="5" rx="${W/2-1}" ry="3"/><rect class="f3" x="${W*.4}" y="2.6" width="${W*.2}" height="3.2" rx="1"/>`;
  else b+=t(W*.3)+br(W*.5,W*.2);
  return`<svg viewBox="0 0 ${W} 10">${b}</svg>`};
const tally=ships=>ships.map(s=>`<span class="tl${s.hits===s.len?" sunk":""}" style="--L:${s.len}" title="${s.n}">${svgShip(s.k,s.len)}</span>`).join("");

/* ---- board rendering ---- */
function board(host){host.className="board";host.innerHTML=`<div class="cl">${[..."ABCDEFGHIJ"].map(x=>`<span>${x}</span>`).join("")}</div><div class="rl">${Array.from({length:N},(_,i)=>`<span>${i+1}</span>`).join("")}</div><div class="grid"></div>`;
  const g=host.querySelector(".grid");for(let i=0;i<100;i++){const b=mk("button","cell u");b.dataset.i=i;b.setAttribute("aria-label",cell(i));g.append(b)}g.append(mk("div","ships"));return g}
function upd(g,B,show,flash){const cs=g.children;
  for(let i=0;i<100;i++){const c=cs[i],v=B.shots[i];c.classList.toggle("m",v===1);c.classList.toggle("h",v===2);c.classList.toggle("u",!v);if(i===flash){c.classList.add("new");setTimeout(()=>c.classList.remove("new"),800)}}
  if(flash>=0&&B.shots[flash]===2){g.classList.remove("shake","sunkfx");void g.offsetWidth;g.classList.add("shake");if(B.sk.has(flash))g.classList.add("sunkfx");setTimeout(()=>g.classList.remove("shake","sunkfx"),800)}
  const L=g.querySelector(".ships");L.replaceChildren();
  B.ships.forEach(s=>{if(!s)return;const sunk=s.hits===s.len,over=G&&G.over;if(!(show||sunk||over))return;
    const e=mk("div","ship"+(s.v?" v":"")+(sunk?" sunk":"")+(!show&&!sunk?" rev":""),svgShip(s.k,s.len));
    const sn=g._sn||(g._sn=new Set()),kk=[s.k,s.r,s.c,s.v,sunk].join();if(!sn.has(kk)){sn.add(kk);e.classList.add("pop")}
    e.style.cssText=`left:calc(var(--c)*${s.c});top:calc(var(--c)*${s.r});width:calc(var(--c)*${s.v?1:s.len});height:calc(var(--c)*${s.v?s.len:1});--L:${s.len}`;L.append(e)})}
const fleets=()=>{$("#ef").innerHTML=G?tally(G.foe.ships):"";$("#pf").innerHTML=G?tally(G.mine.ships):""};

/* ---- setup: click a ship, click the grid (r or right-click rotates) ---- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const origin=(i,len,v)=>{const r=i/N|0,c=i%N,h=len>>1;return v?{r:clamp(r-h,0,N-len),c}:{r,c:clamp(c-h,0,N-len)}};
function startSetup(keep){phase="setup";G=null;P={ships:keep?keep.map(s=>({...s,hits:0})):Array(5).fill(null),sel:keep?-1:0,v:false,hov:null};
  $("#menu").hidden=true;gm.hidden=false;gm.className="setup"+(O?" mp":"");$("#online").hidden=true;$("#end").hidden=true;$("#qt").hidden=false;fleets();pg=board($("#pb"));plates();
  pg.onmouseover=e=>{const b=e.target.closest(".cell");if(b&&phase==="setup"){P.hov=+b.dataset.i;prev()}};
  pg.onmouseleave=()=>{P.hov=null;prev()};
  pg.oncontextmenu=e=>{e.preventDefault();rot()};
  pg.onclick=e=>{const b=e.target.closest(".cell");if(!b||phase!=="setup"||P.locked)return;const i=+b.dataset.i;

$("#go").onclick=()=>startSetup();$("#onl").onclick=goOnline;
let qArm=0;$("#qt").onclick=()=>{const b=$("#qt");if((G&&!G.over||O&&OG&&OG.st!=="done"&&OG.st!=="lobby")&&!qArm){qArm=1;b.textContent="really quit?";setTimeout(()=>{qArm=0;b.textContent="menu"},2200);return}qArm=0;b.textContent="menu";toMenu()};
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();if(k==="r")rot();else if(k==="m")toggleMute();else if(k==="escape"&&phase==="setup"&&P.sel>=0){P.sel=-1;drawSetup()}});
paintCfg();toMenu();
</script>
</body>
</html>
